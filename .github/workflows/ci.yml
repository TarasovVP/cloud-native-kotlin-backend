name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Test and build executable JAR
        run: ./gradlew :server:test :server:fatJar --no-daemon

      - name: Build Docker image
        run: docker build -f server/Dockerfile -t cloud-native-kotlin-backend .
